[project]
name = "psyevoagent-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi==0.141.1",
    "httpx>=0.28,<1",
    "langchain-core==1.6.4",
    "langgraph==1.2.12",
    "langsmith==0.14.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "psutil>=7,<8",
    "types-psutil>=7,<8",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not postgres'"
markers = ["postgres: STEP03 real isolated PostgreSQL acceptance (run explicitly with -m postgres)"]
filterwarnings = [
    "error",
    # Locked Starlette TestClient imports this deprecated AnyIO compatibility alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]
